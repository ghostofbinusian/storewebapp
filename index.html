<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UD. Semeru Putra</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="p-6">

    <script>
        // CONFIGURATION: Replace this with your Google Apps Script Web App URL
        const API_URL = "URL_APP_SCRIPT_ANDA_DISINI";

        let userRole = localStorage.getItem('role') || null;
        let products = [];
        let cart = [];

        // App Initialization
        document.addEventListener("DOMContentLoaded", () => {
            if (!userRole) {
                showView('login-view');
            } else {
                initApp();
            }
        });

        function showView(viewId) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');

            loginBtn.innerText = "Memuat...";
            loginBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
                const data = await res.json();

                if (data.status === "success") {
                    userRole = data.role;
                    localStorage.setItem('role', data.role);
                    initApp();
                } else {
                    alert(data.message);
                    loginBtn.innerText = "Masuk Aplikasi";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                alert("Gagal terhubung ke server database.");
                loginBtn.innerText = "Masuk Aplikasi";
                loginBtn.disabled = false;
            }
        }

        function handleLogout() {
            userRole = null;
            localStorage.clear();
            showView('login-view');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
            document.getElementById('login-btn').innerText = "Masuk Aplikasi";
            document.getElementById('login-btn').disabled = false;
        }

        function initApp() {
            showView('app-view');
            document.getElementById('display-role').innerText = userRole === 'admin' ? 'Mode Admin' : 'Mode Pekerja';
            
            // Set up navigation permissions
            const navbar = document.getElementById('navbar');
            if (userRole === 'admin') {
                navbar.innerHTML = `
                    <button onclick="switchTab('cashier')" id="tab-cashier" class="px-4 py-2 rounded bg-blue-600 text-white font-medium">Menu Kasir</button>
                    <button onclick="switchTab('storage')" id="tab-storage" class="px-4 py-2 rounded bg-slate-800 text-gray-300 font-medium">Kelola Gudang</button>
                `;
                switchTab('cashier');
            } else {
                // Workers only see storage tab, cashier button is missing entirely
                navbar.innerHTML = `
                    <button onclick="switchTab('storage')" id="tab-storage" class="px-4 py-2 rounded bg-blue-600 text-white font-medium">Update Stok Barang</button>
                `;
                switchTab('storage');
            }
            fetchInventory();
        }

        async function fetchInventory() {
            try {
                const res = await fetch(`${API_URL}?role=${userRole}`);
                products = await res.json();
                renderCashierCatalog();
                renderStorageTable();
            } catch (err) {
                console.error("Error fetching inventory:", err);
            }
        }

        function switchTab(tabName) {
            const cashierSection = document.getElementById('cashier-section');
            const storageSection = document.getElementById('storage-section');
            const tabCashier = document.getElementById('tab-cashier');
            const tabStorage = document.getElementById('tab-storage');

            if (tabName === 'cashier' && userRole === 'admin') {
                cashierSection.classList.remove('hidden');
                storageSection.classList.add('hidden');
                if(tabCashier) { tabCashier.className = "px-4 py-2 rounded bg-blue-600 text-white font-medium"; }
                if(tabStorage) { tabStorage.className = "px-4 py-2 rounded bg-slate-800 text-gray-300 font-medium"; }
            } else {
                cashierSection.classList.add('hidden');
                storageSection.classList.remove('hidden');
                if(tabCashier) { tabCashier.className = "px-4 py-2 rounded bg-slate-800 text-gray-300 font-medium"; }
                if(tabStorage) { tabStorage.className = "px-4 py-2 rounded bg-blue-600 text-white font-medium"; }
                
                // Adjust storage inputs form dynamically for worker vs admin
                const dynamicFields = document.getElementById('admin-only-fields');
                const formTitle = document.getElementById('form-title');
                if (userRole === 'worker') {
                    dynamicFields.classList.add('hidden');
                    formTitle.innerText = "Sesuaikan Stok Pekerja";
                } else {
                    dynamicFields.classList.remove('hidden');
                    formTitle.innerText = "Tambah / Edit Barang";
                }
            }
        }

        // CASHIER CODE (FIXED: Clicking element reads proper object reference)
        function renderCashierCatalog() {
            const catalog = document.getElementById('cashier-catalog');
            catalog.innerHTML = "";
            
            if (products.length === 0) {
                catalog.innerHTML = `<div class="text-gray-400 col-span-2 text-center py-4">Tidak ada produk ditemukan</div>`;
                return;
            }

            products.forEach((prod, index) => {
                const itemCard = document.createElement('div');
                itemCard.className = "p-4 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-blue-500 transition shadow-md";
                // Fixed trigger parsing the precise data array index perfectly
                itemCard.onclick = () => addToCart(index);
                
                itemCard.innerHTML = `
                    <div class="font-bold text-lg text-white">${prod.name}</div>
                    <div class="text-emerald-400 font-semibold mt-1">Rp ${Number(prod.price).toLocaleString('id-ID')}</div>
                    <div class="text-sm text-gray-400 mt-2">Sisa Stok: <span class="font-bold text-gray-200">${prod.quantity}</span></div>
                `;
                catalog.appendChild(itemCard);
            });
        }

        function addToCart(index) {
            const product = products[index];
            if (product.quantity <= 0) {
                alert("Stok produk ini sudah habis!");
                return;
            }

            const existingCartItem = cart.find(item => item.itemName === product.name);
            if (existingCartItem) {
                if (existingCartItem.quantity >= product.quantity) {
                    alert("Tidak dapat memasukkan item melebihi sisa stok!");
                    return;
                }
                existingCartItem.quantity += 1;
            } else {
                cart.push({
                    itemName: product.name,
                    price: product.price,
                    quantity: 1
                });
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            const grandTotalEl = document.getElementById('grand-total');
            cartList.innerHTML = "";
            
            let total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                const div = document.createElement('div');
                div.className = "flex justify-between items-center text-sm border-b border-slate-800 pb-2 mb-2";
                div.innerHTML = `
                    <div>
                        <span class="font-semibold text-gray-200">${item.itemName}</span>
                        <span class="text-xs text-gray-400 block">x${item.quantity}</span>
                    </div>
                    <span class="text-emerald-400 font-medium">Rp ${itemTotal.toLocaleString('id-ID')}</span>
                `;
                cartList.appendChild(div);
            });

            grandTotalEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        async function submitCheckout() {
            if (cart.length === 0) {
                alert("Keranjang belanja kosong!");
                return;
            }

            const cName = document.getElementById('cust-name').value || "Pelanggan Walk-in";
            const cPhone = document.getElementById('cust-phone').value || "";
            const checkoutBtn = document.getElementById('checkout-btn');

            checkoutBtn.innerText = "Memproses...";
            checkoutBtn.disabled = true;

            const payload = {
                action: "newSale",
                customerName: cName,
                customerPhone: cPhone,
                items: cart.map(i => ({
                    itemName: i.itemName,
                    quantity: i.quantity,
                    totalPrice: i.price * i.quantity
                }))
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.status === "success") {
                    alert("Transaksi Berhasil Disimpan!");
                    cart = [];
                    document.getElementById('cust-name').value = "";
                    document.getElementById('cust-phone').value = "";
                    renderCart();
                    fetchInventory();
                }
            } catch (err) {
                alert("Gagal melakukan checkout.");
            } finally {
                checkoutBtn.innerText = "Simpan Transaksi (Checkout)";
                checkoutBtn.disabled = false;
            }
        }

        // STORAGE MANAGEMENT CODE
        function renderStorageTable() {
            const tableBody = document.getElementById('storage-table-body');
            const tableHead = document.getElementById('storage-table-head');
            tableBody.innerHTML = "";

            if (userRole === 'admin') {
                tableHead.innerHTML = `
                    <th class="p-3 text-left">Nama Produk</th>
                    <th class="p-3 text-right">Harga Modal</th>
                    <th class="p-3 text-right">Harga Jual</th>
                    <th class="p-3 text-center">Jumlah Stok</th>
                `;
            } else {
                tableHead.innerHTML = `
                    <th class="p-3 text-left">Nama Produk</th>
                    <th class="p-3 text-center">Jumlah Stok</th>
                `;
            }

            products.forEach(p => {
                const row = document.createElement('tr');
                row.className = "border-b border-slate-800 hover:bg-slate-900 cursor-pointer transition";
                row.onclick = () => selectItemToForm(p);

                if (userRole === 'admin') {
                    row.innerHTML = `
                        <td class="p-3 text-gray-200 font-medium">${p.name}</td>
                        <td class="p-3 text-right text-gray-400">Rp ${Number(p.capitalPrice).toLocaleString('id-ID')}</td>
                        <td class="p-3 text-right text-emerald-400">Rp ${Number(p.price).toLocaleString('id-ID')}</td>
                        <td class="p-3 text-center font-bold text-white">${p.quantity}</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td class="p-3 text-gray-200 font-medium">${p.name}</td>
                        <td class="p-3 text-center font-bold text-white">${p.quantity}</td>
                    `;
                }
                tableBody.appendChild(row);
            });
        }

        function selectItemToForm(product) {
            document.getElementById('inv-name').value = product.name;
            document.getElementById('inv-stock').value = product.quantity;
            if (userRole === 'admin') {
                document.getElementById('inv-capital').value = product.capitalPrice;
                document.getElementById('inv-price').value = product.price;
                document.getElementById('inv-name').readOnly = false;
            } else {
                // Workers cannot modify product names, only update numerical stock levels
                document.getElementById('inv-name').readOnly = true;
            }
        }

        async function handleSaveInventory(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('save-inv-btn');
            submitBtn.innerText = "Menyimpan...";
            submitBtn.disabled = true;

            const name = document.getElementById('inv-name').value;
            const stock = document.getElementById('inv-stock').value;
            const capital = document.getElementById('inv-capital').value;
            const price = document.getElementById('inv-price').value;

            const actionType = userRole === 'worker' ? 'workerUpdateStock' : 'updateInventory';
            const payload = {
                action: actionType,
                itemName: name,
                quantity: parseInt(stock),
                ...(userRole === 'admin' && { capitalPrice: parseFloat(capital), price: parseFloat(price) })
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.status === "success") {
                    alert("Data Stok Berhasil Diperbarui!");
                    document.getElementById('inventory-form').reset();
                    document.getElementById('inv-name').readOnly = false;
                    fetchInventory();
                }
            } catch (err) {
                alert("Gagal memperbarui database gudang.");
            } finally {
                submitBtn.innerText = "Simpan Perubahan";
                submitBtn.disabled = false;
            }
        }
    </script>

    <div id="login-view" class="max-w-md mx-auto mt-24 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl hidden">
        <h2 class="text-2xl font-bold text-center mb-2 tracking-wide text-white">UD. Semeru Putra</h2>
        <p class="text-sm text-gray-400 text-center mb-6">Silakan masuk menggunakan akun Anda</p>
        
        <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Nama Pengguna (Username)</label>
                <input type="text" id="username" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl focus:border-blue-500 focus:outline-none text-white" required />
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Kata Sandi (Password)</label>
                <input type="password" id="password" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl focus:border-blue-500 focus:outline-none text-white" required />
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition mt-2">
                Masuk Aplikasi
            </button>
        </form>
    </div>

    <div id="app-view" class="max-w-6xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">UD. Semeru Putra</h1>
                <span id="display-role" class="inline-block mt-1 px-2.5 py-0.5 text-xs font-semibold bg-blue-900 text-blue-200 rounded-full"></span>
            </div>
            <button onclick="handleLogout()" class="bg-red-950 hover:bg-red-900 border border-red-800 text-red-200 text-sm font-semibold px-4 py-2 rounded-xl transition">
                Keluar Keluar
            </button>
        </div>

        <div id="navbar" class="flex gap-3 mb-6"></div>

        <div id="cashier-section" class="grid grid-cols-1 lg:grid-cols-3 gap-6 hidden">
            <div class="lg:col-span-2 bg-slate-950 border border-slate-900 p-5 rounded-2xl">
                <h3 class="text-lg font-bold text-gray-200 mb-4 tracking-wide">Katalog Produk</h3>
                <div id="cashier-catalog" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl h-fit shadow-md">
                <h3 class="text-lg font-bold text-gray-200 mb-4 tracking-wide">Keranjang Belanja</h3>
                <div class="flex flex-col gap-3 mb-4">
                    <input type="text" id="cust-name" placeholder="Nama Pelanggan" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl focus:border-blue-500 focus:outline-none text-white" />
                    <input type="text" id="cust-phone" placeholder="Nomor HP Pelanggan" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl focus:border-blue-500 focus:outline-none text-white" />
                </div>
                
                <div id="cart-list" class="min-h-[120px] max-h-[240px] overflow-y-auto mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800"></div>
                
                <div class="flex justify-between items-center font-bold text-lg mb-4 px-1 text-white">
                    <span>Total Tagihan:</span>
                    <span id="grand-total" class="text-emerald-400">Rp 0</span>
                </div>
                <button onclick="submitCheckout()" id="checkout-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                    Simpan Transaksi (Checkout)
                </button>
            </div>
        </div>

        <div id="storage-section" class="grid grid-cols-1 lg:grid-cols-3 gap-6 hidden">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl h-fit">
                <h3 id="form-title" class="text-lg font-bold text-gray-200 mb-4">Kelola Barang</h3>
                <form id="inventory-form" onsubmit="handleSaveInventory(event)" class="flex flex-col gap-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-400 block mb-1">Nama Produk</label>
                        <input type="text" id="inv-name" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl text-white focus:border-blue-500 focus:outline-none" required />
                    </div>
                    
                    <div id="admin-only-fields" class="flex flex-col gap-4">
                        <div>
                            <label class="text-xs font-semibold text-gray-400 block mb-1">Harga Modal (Rp)</label>
                            <input type="number" id="inv-capital" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl text-white focus:border-blue-500 focus:outline-none" />
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-400 block mb-1">Harga Jual (Rp)</label>
                            <input type="number" id="inv-price" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl text-white focus:border-blue-500 focus:outline-none" />
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-gray-400 block mb-1">Jumlah Stok Baru</label>
                        <input type="number" id="inv-stock" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-sm rounded-xl text-white focus:border-blue-500 focus:outline-none" required />
                    </div>
                    <button type="submit" id="save-inv-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition mt-1 shadow-md">
                        Simpan Perubahan
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-slate-950 border border-slate-900 p-5 rounded-2xl">
                <h3 class="text-lg font-bold text-gray-200 mb-3">Daftar Stok Produk</h3>
                <p class="text-xs text-gray-400 mb-4">*Klik pada baris produk untuk mengedit kuantitas stok secara instan.</p>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr id="storage-table-head" class="bg-slate-900 text-gray-400 border-b border-slate-800"></tr>
                        </thead>
                        <tbody id="storage-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
