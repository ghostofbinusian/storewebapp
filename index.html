<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UD.SemeruPutra Storefront System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
              400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
              800: '#5b21b6', 900: '#4c1d95', 950: '#2e1065',
            },
          },
        },
      },
    }
  </script>
  <style>
    @keyframes pulse-subtle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.98); } }
    .pulse-subtle { animation: pulse-subtle 2s infinite ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased overflow-x-hidden">

  <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full"></div>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all duration-300 opacity-0 pointer-events-none">
    <div class="w-16 h-16 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
    <p id="loading-message" class="mt-4 text-slate-300 font-medium text-sm tracking-wide">Syncing with Database...</p>
  </div>

  <div class="min-h-full flex flex-col">

    <div id="role-selection-view" class="flex-1 flex flex-col items-center justify-center px-4 py-12 bg-slate-950">
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 mb-4">
          <i data-lucide="store" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">UD.<span class="text-brand-400">SemeruPutra</span></h1>
      </div>

      <div class="w-full max-w-md px-4">
        <div id="portal-intro-card" class="p-8 rounded-2xl bg-slate-900/60 border border-slate-800 text-center shadow-2xl">
          <button onclick="showPinEntry()" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-500 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2">
            🔑 Enter Admin Portal
          </button>
        </div>

        <div id="portal-pin-card" class="hidden p-8 rounded-2xl bg-slate-900/60 border border-slate-800 shadow-2xl">
          <form onsubmit="verifyAdminPin(event)" class="space-y-4">
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center tracking-[1em] text-2xl font-bold px-4 py-3 bg-slate-950 border border-slate-800 focus:border-brand-500 text-white rounded-xl focus:outline-none">
            <button type="submit" class="w-full py-2.5 bg-brand-600 text-white rounded-xl text-sm font-bold">Verify PIN</button>
          </form>
        </div>
      </div>
    </div>

    <div id="workspace-view" class="hidden flex-1 flex flex-col min-w-0 bg-slate-950">
      <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4">
          <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-2">
              <span class="text-base font-bold text-white">UD.<span class="text-brand-400">SemeruPutra</span></span>
            </div>
            
            <nav class="flex space-x-1">
              <button onclick="switchTab('cashier')" id="tab-btn-cashier" class="p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium transition-all text-slate-400 flex items-center gap-2">
                <i data-lucide="shopping-cart" class="w-5 h-5 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Cashier</span>
              </button>
              <button onclick="switchTab('storage')" id="tab-btn-storage" class="p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium transition-all text-slate-400 flex items-center gap-2">
                <i data-lucide="database" class="w-5 h-5 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Storage</span>
              </button>
              <button onclick="switchTab('restock')" id="tab-btn-restock" class="p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium transition-all text-slate-400 flex items-center gap-2">
                <i data-lucide="check-square" class="w-5 h-5 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Restock</span>
              </button>
              <button onclick="switchTab('sales')" id="tab-btn-sales" class="p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium transition-all text-slate-400 flex items-center gap-2">
                <i data-lucide="calendar" class="w-5 h-5 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Sales Log</span>
              </button>
            </nav>

            <button onclick="logout()" class="px-3 py-1.5 rounded-xl border border-red-500/20 text-red-400 text-xs font-medium">Exit</button>
          </div>
        </div>
      </header>

      <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col min-h-0">
        
        <div id="tab-content-cashier" class="tab-pane hidden flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
          <div class="flex-1 flex flex-col min-h-0 bg-slate-900/30 border border-slate-800 rounded-2xl p-4">
            <div class="mb-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
              <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="layout-grid" class="w-5 h-5 text-brand-400"></i> Catalog</h2>
              <input oninput="updateSearch(this.value)" type="text" placeholder="Search products..." class="w-full sm:max-w-xs px-4 py-2 border border-slate-700 bg-slate-950 text-slate-200 rounded-xl text-sm">
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar min-h-0">
              <div id="cashier-product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
            </div>
          </div>

          <div class="w-full lg:w-80 flex flex-col min-h-0 bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
            <h2 class="text-lg font-bold text-white mb-3 flex items-center gap-2"><i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i> Cart</h2>
            
            <div class="space-y-2 mb-3">
              <input type="text" id="cart-customer-name" placeholder="Customer Name" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 text-white rounded-xl">
              <input type="text" id="cart-customer-phone" placeholder="Phone Number" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 text-white rounded-xl">
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar border-t border-b border-slate-800/80 my-2 py-2 min-h-[150px]">
              <div id="cart-list" class="flex flex-col gap-2"></div>
            </div>

            <div class="pt-2 space-y-3">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-semibold text-slate-400">Total</span>
                <span id="cart-grand-total" class="text-2xl font-extrabold text-white">Rp 0</span>
              </div>
              <button onclick="checkoutSale()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-lg">Complete Checkout</button>
            </div>
          </div>
        </div>

        <div id="tab-content-storage" class="tab-pane hidden flex-1 flex flex-col gap-4 min-h-0">
          <div class="bg-slate-900/30 border border-slate-800 rounded-2xl overflow-hidden">
            <button onclick="toggleNewItemForm()" class="w-full flex items-center justify-between px-4 py-3 text-sm font-bold text-white">
              <span class="flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-brand-400"></i> Add New Product</span>
              <i id="add-form-chevron" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-300"></i>
            </button>
            <div id="new-item-form-container" class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out bg-slate-900/10">
              <form id="new-item-form" onsubmit="submitNewItem(event)" class="p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input required name="name" type="text" placeholder="Product Name" class="w-full px-3 py-1.5 border border-slate-700 bg-slate-950 text-slate-200 rounded-xl text-xs">
                <input required name="price" type="number" placeholder="Price (IDR)" class="w-full px-3 py-1.5 border border-slate-700 bg-slate-950 text-slate-200 rounded-xl text-xs">
                <input required name="quantity" type="number" placeholder="Stock Qty" class="w-full px-3 py-1.5 border border-slate-700 bg-slate-950 text-slate-200 rounded-xl text-xs">
                <div class="sm:col-span-3 flex justify-end"><button type="submit" class="px-4 py-1.5 bg-brand-600 text-white rounded-xl text-xs font-bold">Save</button></div>
              </form>
            </div>
          </div>

          <div class="flex-1 flex flex-col min-h-0 bg-slate-900/30 border border-slate-800 rounded-2xl p-4">
            <div class="flex-1 overflow-auto no-scrollbar rounded-xl">
              <table class="w-full border-collapse text-left text-xs text-slate-300">
                <thead class="bg-slate-900 text-slate-400 font-semibold uppercase sticky top-0 z-10 border-b border-slate-800">
                  <tr>
                    <th class="px-4 py-3">Product</th>
                    <th class="px-4 py-3 w-24">Price</th>
                    <th class="px-4 py-3 w-20">Qty</th>
                    <th class="px-4 py-3 text-center w-16">Pull</th>
                    <th class="px-4 py-3 text-right w-16">Save</th>
                  </tr>
                </thead>
                <tbody id="inventory-table-body" class="divide-y divide-slate-800/50"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="tab-content-restock" class="tab-pane hidden flex-1 flex flex-col min-h-0">
          <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="check-square" class="w-5 h-5 text-amber-500"></i> Restock Pull Sheet</h2>
          <div id="restock-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 overflow-y-auto no-scrollbar"></div>
        </div>

        <div id="tab-content-sales" class="tab-pane hidden flex-1 flex flex-col gap-4 min-h-0">
          <div class="p-4 bg-slate-900/40 border border-slate-800 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full sm:w-auto">
              <i data-lucide="calendar" class="w-5 h-5 text-brand-400"></i>
              <input type="date" id="sales-calendar-input" onchange="fetchSalesForDate(this.value)" class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-sm font-medium text-white focus:outline-none focus:border-brand-500 w-full sm:w-auto">
            </div>
            <div class="flex gap-4 text-xs font-semibold text-slate-400">
              <div>Total Sales: <span id="sales-day-total-val" class="text-emerald-400 font-bold">Rp 0</span></div>
            </div>
          </div>

          <div id="sales-log-grouped-container" class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-3 min-h-0"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzL7tYuMLadAtzaZ_dJV8fkmg0do0es6LqbaDIK77e_OLHLxwfSe2hce0s3YNb6Tpnr/exec';

    function formatIDR(val) {
      return 'Rp ' + Math.round(parseFloat(val) || 0).toLocaleString('id-ID');
    }

    const state = {
      role: null, activeTab: 'cashier', inventory: [], cart: {}, searchQuery: '', selectedSalesDate: ''
    };

    function render() {
      if (!state.role) {
        document.getElementById('role-selection-view').classList.remove('hidden');
        document.getElementById('workspace-view').classList.add('hidden');
        return;
      }
      document.getElementById('role-selection-view').classList.add('hidden');
      document.getElementById('workspace-view').classList.remove('hidden');

      document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-content-${state.activeTab}`).classList.remove('hidden');
      
      ['cashier', 'storage', 'restock', 'sales'].forEach(tab => {
        const btn = document.getElementById(`tab-btn-${tab}`);
        btn.className = state.activeTab === tab 
          ? "p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium bg-brand-500/10 text-brand-400 border border-brand-500/20 flex items-center gap-2"
          : "p-2 sm:px-4 sm:py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 flex items-center gap-2";
      });
      
      if (state.activeTab === 'cashier') renderCashier();
      if (state.activeTab === 'storage') renderStorage();
      if (state.activeTab === 'restock') renderRestock();

      lucide.createIcons();
    }

    function renderCashier() {
      const grid = document.getElementById('cashier-product-grid');
      const filtered = state.inventory.filter(item => item.name.toLowerCase().includes(state.searchQuery.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-500 text-xs">No products found</div>`;
        renderCart(); return;
      }

      grid.innerHTML = filtered.map(item => {
        const cartQty = state.cart[item.name]?.quantity || 0;
        const remainingStock = Math.max(0, item.quantity - cartQty);
        const disabled = item.quantity <= 0 || remainingStock <= 0;

        return `
          <button onclick="${disabled ? '' : `addToCart('${item.name.replace(/'/g, "\\'")}')`}"
            class="relative flex flex-col p-4 rounded-xl border bg-slate-950/40 text-left ${disabled ? 'opacity-40 cursor-not-allowed border-transparent' : 'border-slate-800 hover:border-brand-500/40'}" ${disabled ? 'disabled' : ''}>
            <span class="text-[9px] uppercase font-bold text-slate-400 mb-1">${item.quantity <= 0 ? 'SOLD OUT' : `${remainingStock} left`}</span>
            <h4 class="text-xs font-bold text-white mb-2 truncate w-full">${item.name}</h4>
            <span class="text-sm font-extrabold text-white mt-auto">${formatIDR(item.price)}</span>
            ${cartQty > 0 ? `<div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-brand-500 text-white text-[10px] font-bold flex items-center justify-center">${cartQty}</div>` : ''}
          </button>
        `;
      }).join('');
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById('cart-list');
      const grandTotalLabel = document.getElementById('cart-grand-total');
      const items = Object.values(state.cart);

      if (items.length === 0) {
        cartList.innerHTML = `<div class="py-8 text-center text-slate-600 text-xs">Empty Cart</div>`;
        grandTotalLabel.innerText = "Rp 0"; return;
      }

      let sum = 0;
      cartList.innerHTML = items.map(entry => {
        sum += entry.item.price * entry.quantity;
        return `
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-950 border border-slate-800 text-xs">
            <div class="min-w-0 flex-1 pr-2">
              <h5 class="font-bold text-white truncate">${entry.item.name}</h5>
              <span class="text-brand-400 font-bold">${formatIDR(entry.item.price * entry.quantity)}</span>
            </div>
            <div class="flex items-center bg-slate-900 rounded-lg p-0.5 gap-1.5">
              <button onclick="decrementCartItem('${entry.item.name.replace(/'/g, "\\'")}')" class="px-1.5 text-slate-400 font-bold">-</button>
              <span class="text-white font-bold">${entry.quantity}</span>
              <button onclick="incrementCartItem('${entry.item.name.replace(/'/g, "\\'")}')" class="px-1.5 text-slate-400 font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');
      grandTotalLabel.innerText = formatIDR(sum);
    }

    function renderStorage() {
      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = state.inventory.map((item, idx) => `
        <tr class="border-b border-slate-800/40">
          <td class="px-4 py-3 font-bold text-white truncate max-w-[120px]">${item.name}</td>
          <td class="px-4 py-3"><input type="number" id="price-input-${idx}" value="${item.price}" class="w-20 px-1 py-0.5 bg-slate-950 border border-slate-800 rounded text-center"></td>
          <td class="px-4 py-3"><input type="number" id="qty-input-${idx}" value="${item.quantity}" class="w-14 px-1 py-0.5 bg-slate-950 border border-slate-800 rounded text-center"></td>
          <td class="px-4 py-3 text-center"><input type="checkbox" id="restock-toggle-${idx}" ${item.needsRestock ? 'checked' : ''} class="w-3.5 h-3.5 accent-brand-500"></td>
          <td class="px-4 py-3 text-right"><button onclick="updateRowInventory('${item.name.replace(/'/g, "\\'")}', ${idx})" class="p-1 bg-brand-600 rounded text-white"><i data-lucide="save" class="w-3.5 h-3.5"></i></button></td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function renderRestock() {
      const container = document.getElementById('restock-list');
      const filtered = state.inventory.filter(i => i.needsRestock);
      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-slate-500 text-xs">All Items Packed!</div>`;
        return;
      }
      container.innerHTML = filtered.map(item => `
        <div class="p-4 bg-slate-900/60 border border-slate-800 rounded-xl flex justify-between items-center text-xs">
          <span class="font-bold text-white">${item.name}</span>
          <span class="text-amber-400 font-mono bg-amber-500/10 px-2 py-0.5 rounded">Qty: ${item.quantity}</span>
        </div>
      `).join('');
    }

    async function fetchSalesForDate(dateString) {
      if (!dateString) return;
      state.selectedSalesDate = dateString;
      showLoader(true, `Reading files for date: ${dateString}...`);
      
      try {
        const res = await fetch(`${SCRIPT_URL}?getSalesDate=${dateString}`);
        const result = await res.json();
        const container = document.getElementById('sales-log-grouped-container');
        const dayTotalLabel = document.getElementById('sales-day-total-val');
        
        if (result.status === "empty" || !result.data || result.data.length === 0) {
          container.innerHTML = `<div class="py-12 text-center text-slate-500 text-xs">No records tracked for this calendar date.</div>`;
          dayTotalLabel.innerText = "Rp 0";
          return;
        }
        
        let dailyGrandSum = 0;
        container.innerHTML = result.data.map(session => {
          dailyGrandSum += session.grandTotal;
          const itemsLines = session.items.map(i => `
            <div class="flex justify-between text-slate-300 py-0.5">
              <span>${i.itemName} <b class="text-slate-500">x${i.quantity}</b></span>
              <span>${formatIDR(i.total)}</span>
            </div>
          `).join('');

          return `
            <div class="p-4 bg-slate-900/50 border border-slate-800 rounded-xl text-xs space-y-2">
              <div class="flex justify-between border-b border-slate-800/80 pb-1.5 items-center">
                <div>
                  <h4 class="font-bold text-white">${session.customerName}</h4>
                  <p class="text-[10px] text-slate-400 font-mono">${session.customerPhone || 'No Phone Number'}</p>
                </div>
                <span class="text-slate-500 font-mono">${session.time}</span>
              </div>
              <div class="bg-slate-950/50 p-2 rounded-lg divide-y divide-slate-900/30">${itemsLines}</div>
              <div class="flex justify-between font-bold pt-1"><span class="text-slate-400">Paid Amount</span><span class="text-emerald-400">${formatIDR(session.grandTotal)}</span></div>
            </div>
          `;
        }).join('');
        
        dayTotalLabel.innerText = formatIDR(dailyGrandSum);
      } catch (err) {
        showToast('error', 'Could not open sales spreadsheets.');
      } finally {
        showLoader(false);
      }
    }

    async function refreshData() {
      showLoader(true, "Syncing catalog layout...");
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        state.inventory = data.map(item => ({
          name: item.name, price: parseFloat(item.price) || 0, quantity: parseInt(item.quantity) || 0, needsRestock: !!item.needsRestock
        }));
      } catch (err) {
        showToast('error', 'Error syncing sheets catalog.');
      } finally { showLoader(false); render(); }
    }

    async function checkoutSale() {
      const cartItems = Object.values(state.cart);
      if (cartItems.length === 0) return;

      const customerName = document.getElementById('cart-customer-name').value.trim() || "Walk-in Customer";
      const customerPhone = document.getElementById('cart-customer-phone').value.trim();

      showLoader(true, "Logging to Sheets & generating PDF invoice...");

      const payload = {
        action: 'newSale',
        customerName: customerName,
        customerPhone: customerPhone,
        items: cartItems.map(entry => ({
          itemName: entry.item.name, quantity: entry.quantity, totalPrice: entry.item.price * entry.quantity
        }))
      };

      try {
        // 1. Save data safely to Google Sheets
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        
        // 2. GENERATE OFFICIAL STORE PDF INVOICE (REBRANDED TO UD.SEMERUPUTRA)
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a6' }); 
        const invoiceNum = Math.floor(100000 + Math.random() * 900000);
        const dateStr = new Date().toLocaleDateString('id-ID');

        // Styling & Header Brand
        doc.setFillColor(124, 58, 237); 
        doc.rect(0, 0, 105, 12, 'F'); 
        doc.setTextColor(255, 255, 255);
        doc.setFont("Outfit", "bold");
        doc.setFontSize(12); // Slightly reduced font size to clear layout space
        doc.text("UD.SEMERUPUTRA INVOICE", 6, 8);

        // Meta details
        doc.setTextColor(51, 65, 85);
        doc.setFontSize(8);
        doc.setFont("Helvetica", "normal");
        doc.text(`Invoice Ref: #${invoiceNum}`, 6, 20);
        doc.text(`Date: ${dateStr}`, 6, 24);
        doc.text(`Customer: ${customerName}`, 6, 28);
        if(customerPhone) doc.text(`Phone: ${customerPhone}`, 6, 32);

        // Table Header Accent Lines
        doc.setDrawColor(226, 232, 240);
        doc.line(6, 36, 99, 36);
        doc.setFont("Helvetica", "bold");
        doc.text("Item Details", 6, 40);
        doc.text("Qty", 75, 40);
        doc.text("Total", 85, 40);
        doc.line(6, 42, 99, 42);

        // Populate purchased rows dynamically
        doc.setFont("Helvetica", "normal");
        let yPosition = 47;
        let grandTotalSum = 0;

        cartItems.forEach(entry => {
          let currentItemCost = entry.item.price * entry.quantity;
          grandTotalSum += currentItemCost;
          
          doc.text(entry.item.name, 6, yPosition, { maxWidth: 60 });
          doc.text(entry.quantity.toString(), 76, yPosition);
          doc.text(formatIDR(currentItemCost).replace("Rp", "").trim(), 85, yPosition);
          yPosition += 6;
        });

        // Subtotal and Closing blocks
        doc.line(6, yPosition, 99, yPosition);
        yPosition += 6;
        doc.setFont("Helvetica", "bold");
        doc.text("Grand Total:", 55, yPosition);
        doc.text(formatIDR(grandTotalSum), 75, yPosition);

        yPosition += 12;
        doc.setFont("Helvetica", "oblique");
        doc.setFontSize(7);
        doc.setTextColor(148, 163, 184);
        doc.text("Thank you for choosing UD.SemeruPutra. All logs are digital.", 52, yPosition, { align: "center" });

        // 3. Trigger document save download sheet
        doc.save(`Invoice_${invoiceNum}.pdf`);

        // 4. Trigger messaging redirect to WhatsApp
        if (customerPhone) {
          let formattedPhone = customerPhone.replace(/[^0-9]/g, '');
          if (formattedPhone.startsWith('0')) {
            formattedPhone = '62' + formattedPhone.slice(1);
          }

          let waMsg = `✉️ *UD.SemeruPutra Digital Receipt*\n\n`;
          waMsg += `Hello *${customerName}*, thank you for your order! Your official invoice file \`Invoice_${invoiceNum}.pdf\` has been generated successfully and downloaded to our storefront terminal. Sending copy over directly...`;
          
          const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(waMsg)}`;
          window.open(whatsappUrl, '_blank');
        }

        showToast('success', 'Official Invoice Issued!');
        state.cart = {};
        document.getElementById('cart-customer-name').value = '';
        document.getElementById('cart-customer-phone').value = '';
        
        if (state.selectedSalesDate === new Date().toISOString().split('T')[0]) {
          fetchSalesForDate(state.selectedSalesDate);
        }
      } catch (err) {
        showToast('error', 'Network failure updating checkout.');
      } finally { showLoader(false); await refreshData(); }
    }

    async function updateRowInventory(name, idx) {
      const qty = parseInt(document.getElementById(`qty-input-${idx}`).value) || 0;
      const price = parseFloat(document.getElementById(`price-input-${idx}`).value) || 0;
      const restock = document.getElementById(`restock-toggle-${idx}`).checked;

      showLoader(true, "Updating sheet row...");
      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateInventory', itemName: name, quantity: qty, price: price, needsRestock: restock }) });
        showToast('success', 'Saved.');
      } catch (e) { showToast('error', 'Failed saving row.'); }
      finally { showLoader(false); await refreshData(); }
    }

    async function submitNewItem(e) {
      e.preventDefault();
      const form = document.getElementById('new-item-form');
      const formData = new FormData(form);
      const payload = { action: 'updateInventory', itemName: formData.get('name').trim(), price: parseFloat(formData.get('price')) || 0, quantity: parseInt(formData.get('quantity')) || 0, needsRestock: false };

      showLoader(true);
      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        form.reset(); toggleNewItemForm(); showToast('success', 'Item Added.');
      } catch (err) { showToast('error', 'Error writing row.'); }
      finally { showLoader(false); await refreshData(); }
    }

    function showPinEntry() {
      document.getElementById('portal-intro-card').classList.add('hidden');
      document.getElementById('portal-pin-card').classList.remove('hidden');
      document.getElementById('pin-input').focus();
    }
    function verifyAdminPin(e) {
      e.preventDefault();
      if (document.getElementById('pin-input').value === '2411') { state.role = 'admin'; render(); } 
      else { alert('Invalid PIN'); }
    }
    function switchTab(tab) { 
      state.activeTab = tab; 
      render(); 
      if (tab === 'sales' && !state.selectedSalesDate) {
        const localTodayStr = new Date().toISOString().split('T')[0];
        document.getElementById('sales-calendar-input').value = localTodayStr;
        fetchSalesForDate(localTodayStr);
      }
    }
    function logout() { state.role = null; state.cart = {}; render(); }
    function updateSearch(val) { state.searchQuery = val; renderCashier(); }
    function toggleNewItemForm() {
      const container = document.getElementById('new-item-form-container');
      const isOpen = container.style.maxHeight && container.style.maxHeight !== "0px";
      container.style.maxHeight = isOpen ? "0px" : container.scrollHeight + "px";
    }
    function addToCart(name) {
      const item = state.inventory.find(i => i.name === name);
      if (!item) return;
      if (!state.cart[name]) state.cart[name] = { quantity: 1, item: item };
      else if (state.cart[name].quantity < item.quantity) state.cart[name].quantity++;
      renderCashier();
    }
    function incrementCartItem(name) { if (state.cart[name] && state.cart[name].quantity < state.cart[name].item.quantity) { state.cart[name].quantity++; renderCashier(); } }
    function decrementCartItem(name) {
      if (state.cart[name]) {
        if (state.cart[name].quantity > 1) state.cart[name].quantity--;
        else delete state.cart[name];
        renderCashier();
      }
    }
    function showLoader(show, msg = "Loading...") {
      const loader = document.getElementById('loading-overlay');
      document.getElementById('loading-message').innerText = msg;
      loader.className = show ? "fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all duration-300" : "hidden";
    }
    function showToast(type, msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl border text-xs font-semibold ${type === 'success' ? 'bg-slate-900 border-emerald-500/20 text-emerald-400' : 'bg-slate-900 border-red-500/20 text-red-400'}`;
      toast.innerText = msg; container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    window.addEventListener('DOMContentLoaded', () => { refreshData(); });
  </script>
</body>
</html>
